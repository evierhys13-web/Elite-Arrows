plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.elitearrows.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.elitearrows.app"
        minSdk 24
        targetSdk 35
        versionCode 2330
        versionName "2.5.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "en"
    }
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    signingConfigs {
        release {
            def keystoreFile = file('../elite-arrows-keystore.jks')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'EliteArrows2026'
                keyAlias 'elite-arrows'
                keyPassword 'EliteArrows2026'
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'full'
            }
        }
    }

    // Ensure the release folder exists and copy the bundle there after build
    tasks.configureEach { task ->
        if (task.name == 'bundleRelease') {
            task.doLast {
                def buildBundle = file("${layout.buildDirectory.get().asFile}/outputs/bundle/release/app-release.aab")
                def releaseDir = file("$projectDir/release")
                if (buildBundle.exists()) {
                    if (!releaseDir.exists()) releaseDir.mkdirs()
                    copy {
                        from buildBundle
                        into releaseDir
                    }
                    println "Copied signed bundle to: ${releaseDir.absolutePath}"
                }
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Google Play Store Core (In-App Reviews & Updates)
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:app-update:2.1.0'
    
    // Modern Browser and Layout support
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.window:window:1.5.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // CameraX
    def camerax_version = "1.6.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    // JDK Desugaring for Java 21 features on older devices
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

apply from: 'capacitor.build.gradle'
