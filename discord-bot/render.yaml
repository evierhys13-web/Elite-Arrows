services:
  - type: web
    name: elite-arrows-discord-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: elitearrowsapp
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
    autoDeploy: false